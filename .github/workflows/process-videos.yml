name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      # Pin ffmpeg 6.1 (same series as March's apt 6.1.1). Two environmental regressions
      # made the old setup fail: (1) the Azure apt mirror started stalling apt-get for 25+ min,
      # and (2) the only readily-available static builds (npm ffmpeg-static on Linux, and
      # setup-ffmpeg) are johnvansickle 7.0.2, which SEGFAULTS reading Arweave streams.
      # ffmpeg 6.x does not. Fetch the 6.1 static build from a reliable source (not the apt
      # mirror) and use it for BOTH the bare `ffmpeg` execSync calls (/usr/local/bin) and
      # fluent-ffmpeg's setFfmpegPath(ffmpeg-static). No render-logic change.
      - name: Pin ffmpeg 6.1 (7.0.2 segfaults on Arweave seeks)
        working-directory: ./worker
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-6.1-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-6.1-amd64-static/ffmpeg node_modules/ffmpeg-static/ffmpeg
          cp /tmp/ffmpeg-6.1-amd64-static/ffprobe node_modules/ffmpeg-static/ffprobe || true
          chmod +x node_modules/ffmpeg-static/ffmpeg
          sudo ln -sf "$(pwd)/node_modules/ffmpeg-static/ffmpeg" /usr/local/bin/ffmpeg
          sudo ln -sf "$(pwd)/node_modules/ffmpeg-static/ffprobe" /usr/local/bin/ffprobe || true
          hash -r
          echo "which ffmpeg: $(which ffmpeg)"
          ffmpeg -version | head -1

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
