name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install ImageMagick
        run: sudo apt-get install -y --no-install-recommends imagemagick

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
