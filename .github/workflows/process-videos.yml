name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      # Pin ffmpeg 6.1.3 (BtbN full GPL build). This single binary fixes every failure mode
      # hit while the apt mirror is down and npm ffmpeg-static ships johnvansickle 7.0.2:
      #   - 6.x (not 7.0.2) encodes variable-frame-rate iPhone .mov clips (xfade/libx264)
      #   - full build includes the drawtext filter (--enable-libfreetype/libass) for text overlays
      #   - GitHub-hosted release = reliable download, no apt mirror dependency
      # Audio reads LOCAL files (download-to-local), so ffmpeg never touches HTTPS. drawtext
      # presence verified via `strings`. Used for both bare `ffmpeg` and fluent setFfmpegPath.
      - name: Pin ffmpeg 6.1.3 (full build, drawtext)
        working-directory: ./worker
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-08-31-13-00/ffmpeg-n6.1.3-linux64-gpl-6.1.tar.xz" -o /tmp/ffmpeg.tar.xz
          tar xf /tmp/ffmpeg.tar.xz -C /tmp
          BIN="/tmp/ffmpeg-n6.1.3-linux64-gpl-6.1/bin"
          cp "$BIN/ffmpeg" node_modules/ffmpeg-static/ffmpeg
          chmod +x node_modules/ffmpeg-static/ffmpeg
          sudo cp "$BIN/ffmpeg" /usr/local/bin/ffmpeg
          sudo cp "$BIN/ffprobe" /usr/local/bin/ffprobe
          hash -r
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q ' drawtext ' && echo "drawtext: OK" || echo "drawtext: MISSING"

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
