name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      # Install the DYNAMICALLY-linked apt ffmpeg (6.1.x) — exactly what worked in March.
      # The static johnvansickle builds (npm ffmpeg-static on Linux, setup-ffmpeg) SEGFAULT
      # reading Arweave HTTPS streams in the audio path (confirmed on both 6.1 and 7.0.2).
      # The only reason apt broke was GitHub's default azure.archive.ubuntu.com mirror
      # stalling for 25+ min, so swap to the canonical mirror and add retries.
      - name: Install ffmpeg (apt, dynamic)
        timeout-minutes: 8
        working-directory: ./worker
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends ffmpeg
          # Force every ffmpeg entrypoint to the dynamic apt build: bare `ffmpeg` (execSync,
          # audio HTTPS) and fluent-ffmpeg's setFfmpegPath(ffmpeg-static). Static builds segfault.
          sudo ln -sf /usr/bin/ffmpeg /usr/local/bin/ffmpeg
          ln -sf /usr/bin/ffmpeg node_modules/ffmpeg-static/ffmpeg
          hash -r
          echo "which ffmpeg: $(which ffmpeg)"
          ffmpeg -version | head -1
          echo "linkage:" && (ldd /usr/bin/ffmpeg | head -1 || true)

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
