name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      # Put the npm ffmpeg-static binary (already a worker dependency) on PATH for the bare
      # `ffmpeg` execSync calls. The static binary is safe now because the worker downloads
      # all media (audio AND video) to LOCAL files before invoking ffmpeg — ffmpeg never reads
      # HTTPS, which is what made the static build segfault. No apt mirror dependency.
      - name: Link ffmpeg-static onto PATH
        working-directory: ./worker
        run: |
          sudo ln -sf "$(pwd)/node_modules/ffmpeg-static/ffmpeg" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
