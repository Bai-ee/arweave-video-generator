name: Process Video Jobs

on:
  schedule:
    - cron: '*/1 * * * *' # Run every minute
  workflow_dispatch: # Allow manual triggering
  repository_dispatch: # Allow triggering via GitHub API (webhook)
    types: [process-video-job, test-webhook-trigger] # Custom event types

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      # Pin ffmpeg 6.1 (same series as March's apt 6.1.1). The johnvansickle 7.0.2 static
      # binary — what npm ffmpeg-static ships on Linux — fails two ways: it segfaults reading
      # HTTPS, AND it fails libx264/xfade encoding of variable-frame-rate iPhone .mov clips
      # ("current rate 1/0 is invalid"). ffmpeg 6.x handles both (proven: macOS ffmpeg-static
      # 6.0 renders these locally). Audio already reads LOCAL files (download-to-local), so
      # 6.1 never touches HTTPS. Use 6.1 for bare `ffmpeg` and fluent's setFfmpegPath. No apt.
      - name: Pin ffmpeg 6.1
        working-directory: ./worker
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-6.1-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-6.1-amd64-static/ffmpeg node_modules/ffmpeg-static/ffmpeg
          chmod +x node_modules/ffmpeg-static/ffmpeg
          sudo ln -sf "$(pwd)/node_modules/ffmpeg-static/ffmpeg" /usr/local/bin/ffmpeg
          hash -r
          ffmpeg -version | head -1

      - name: Process video jobs
        working-directory: ./worker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: editvideos-63486.firebasestorage.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: node processor.js
