<header id="site-header">
  <div id="site-header-inner">
    <a id="site-wordmark" href="index.html"><img id="site-wordmark-logo" src="img/square-ue.png" alt="Underground Existence"></a>
    <nav id="primary-nav" aria-label="Primary">
      <a class="primary-nav-link{{NAV_ACTIVE_MIXES}}" href="index.html">Mixes</a>
      <a class="primary-nav-link{{NAV_ACTIVE_RESIDENTS}}" href="residents.html">Selectors</a>
      <a class="primary-nav-link{{NAV_ACTIVE_ARCHIVE}}" href="archive.html">Archive</a>
      <a class="primary-nav-link{{NAV_ACTIVE_ABOUT}}" href="about.html">About</a>
    </nav>
    <div id="nav-desktop-actions">
      <span id="nav-search-divider"></span>
      <button id="nav-search-toggle" type="button" aria-label="Search">
        <svg class="icon-svg"><use href="#i-search"></use></svg>
        <span>Search</span>
      </button>
      <!-- Theme toggle. Markup is the DARK default (sun = "switch to light"); the inline
           theme block in partials/head.html rewrites the <use> href, aria-label and
           aria-pressed when light is active. Styling belongs to css/site.css. -->
      <button id="nav-theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="icon-svg"><use href="#i-sun"></use></svg>
      </button>
    </div>
    <div id="mobile-nav-actions">
      <button id="mobile-search-toggle" type="button" aria-label="Search">
        <svg class="icon-svg" style="width:20px;height:20px"><use href="#i-search"></use></svg>
      </button>
      <button id="mobile-theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
        <svg class="icon-svg" style="width:20px;height:20px"><use href="#i-sun"></use></svg>
      </button>
      <button id="mobile-menu-toggle" type="button" aria-label="Menu">
        <svg class="icon-svg" style="width:22px;height:22px"><use href="#i-menu"></use></svg>
      </button>
    </div>
  </div>
  <div id="mobile-menu">
    <a class="mobile-menu-link{{NAV_ACTIVE_MIXES}}" href="index.html">Mixes</a>
    <a class="mobile-menu-link{{NAV_ACTIVE_RESIDENTS}}" href="residents.html">Selectors</a>
    <a class="mobile-menu-link{{NAV_ACTIVE_ARCHIVE}}" href="archive.html">Archive</a>
    <a class="mobile-menu-link{{NAV_ACTIVE_ABOUT}}" href="about.html">About</a>
  </div>
</header>
<!-- Runs the moment the two toggles have been parsed, so a returning light-theme visitor never
     sees the dark-default sun icon repaint into a moon. All logic lives in partials/head.html;
     this is a call, not a second implementation, and is a no-op if that block ever goes away. -->
<script>window.__ueThemeSync && window.__ueThemeSync();</script>
